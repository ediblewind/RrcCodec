# ============================================================================
# CI：构建矩阵 + 测试 + 安装消费 + 生成物一致性
# ============================================================================
name: CI

permissions:
  contents: write

on:
  push:
  pull_request:

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3
      - name: Configure (Release + -Werror)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRRC_CODEC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 8
      - name: "Test (ctest: unit/golden/messages/install/headers/examples)"
        run: ctest --test-dir build --output-on-failure
      - name: Generator unit tests
        working-directory: tools/rrcgen
        run: python3 -m unittest discover -s tests

      - name: Generated code consistency
        working-directory: tools/rrcgen
        run: |
          python3 -m rrcgen --input "../../data/38.331_v*.asn" \
            --check-input-sha256 ../../data/asn-input.sha256 \
            --repo-root ../.. --check
      - name: Baseline sizes
        run: |
          ls -lh include/rrc_codec/types/rrc_types.h
          ls -lh build/librrc_codec.a

  linux-clang:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config
      - name: Configure + build + test (ASan/UBSan)
        run: |
          set -o pipefail
          (cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
             -DRRC_CODEC_WARNINGS_AS_ERRORS=ON -DRRC_CODEC_ENABLE_SANITIZERS=ON
           cmake --build build --parallel 8
           ctest --test-dir build --output-on-failure -E rrc_codec_install_consumers) 2>&1 | tee ci.log \
            || { tail -n 40 ci.log | sed 's/^/::error::/'; exit 1; }

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRRC_CODEC_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel 8 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | Select-String -Pattern 'error|warning' | Select-Object -First 20 | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content test.log | Select-String -Pattern 'FAILED|failure|error|Failed' | Select-Object -First 20 | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
      - name: Generated code consistency
        working-directory: tools/rrcgen
        shell: pwsh
        run: |
          python -m rrcgen --input "../../data/38.331_v*.asn" `
            --check-input-sha256 ../../data/asn-input.sha256 `
            --repo-root ../.. --check
      - name: Publish failure log to ci-debug branch
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) { Copy-Item build.log ci-windows-build.log }
          if (Test-Path test.log) { Copy-Item test.log ci-windows-test.log }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug
          git add -f ci-windows-*.log
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "ci: windows failure log ($env:GITHUB_SHA) [skip ci]"
          git push -f origin ci-debug
