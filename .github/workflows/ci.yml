# ============================================================================
# CI：构建矩阵 + 测试 + 安装消费 + 生成物一致性（方案 7.8 / 9.4）
# ============================================================================
name: CI

on:
  push:
  pull_request:

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3
      - name: Configure (Release + -Werror)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRRC_CODEC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 8
      - name: Test (ctest: unit/golden/messages/install/headers/examples)
        run: ctest --test-dir build --output-on-failure
      - name: Generator unit tests
        working-directory: tools/rrcgen
        run: python3 -m unittest discover -s tests

      - name: Generated code consistency
        working-directory: tools/rrcgen
        run: |
          python3 -m rrcgen --input ../../data/38.331_v18.10.0.asn \
            --check-input-sha256 ../../data/asn-input.sha256 \
            --repo-root ../.. --check
      - name: Baseline sizes
        run: |
          ls -lh include/rrc_codec/types/rrc_types.h
          ls -lh build/librrc_codec.a

  linux-clang:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config
      - name: Configure + build + test (ASan/UBSan)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DRRC_CODEC_WARNINGS_AS_ERRORS=ON -DRRC_CODEC_ENABLE_SANITIZERS=ON
          cmake --build build --parallel 8
          ctest --test-dir build --output-on-failure

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DRRC_CODEC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 8
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Generated code consistency
        working-directory: tools/rrcgen
        shell: pwsh
        run: |
          python -m rrcgen --input ../../data/38.331_v18.10.0.asn `
            --check-input-sha256 ../../data/asn-input.sha256 `
            --repo-root ../.. --check
